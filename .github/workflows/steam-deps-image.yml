name: steam-deps-image

# Rebuilds ghcr.io/unitystation/pudu-steamrt-deps (glib, libsoup3, WebKitGTK for sniper).
# WebKit takes hours, so it only runs when Dockerfile.deps changes on master or by hand.

on:
    workflow_dispatch:
    push:
        branches:
            - master
        paths:
            - tools/steam-linux/Dockerfile.deps

permissions:
    contents: read
    packages: write

jobs:
    build-deps:
        runs-on: ubuntu-latest
        timeout-minutes: 350
        steps:
            - uses: actions/checkout@v4

            - name: free disk space
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  df -h /

            - name: resolve image tags
              id: tags
              run: |
                  image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pudu-steamrt-deps"
                  webkit=$(sed -n 's/^ARG WEBKIT_VERSION=//p' tools/steam-linux/Dockerfile.deps)
                  echo "image=$image" >> "$GITHUB_OUTPUT"
                  echo "webkit=$webkit" >> "$GITHUB_OUTPUT"

            - name: log in to ghcr
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 4 cores, 16 GB: 4 jobs avoids OOM
            - name: build deps image
              run: |
                  docker build \
                    --build-arg WEBKIT_JOBS=4 \
                    -t "${{ steps.tags.outputs.image }}:webkit-${{ steps.tags.outputs.webkit }}" \
                    -t "${{ steps.tags.outputs.image }}:latest" \
                    -f tools/steam-linux/Dockerfile.deps tools/steam-linux

            - name: push deps image
              run: |
                  docker push "${{ steps.tags.outputs.image }}:webkit-${{ steps.tags.outputs.webkit }}"
                  docker push "${{ steps.tags.outputs.image }}:latest"
