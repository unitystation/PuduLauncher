name: steam

# Builds the Steam versions (updater compiled out) for every platform and uploads each
# depot as an artifact of the run. Publishing to Steam is done by hand from those artifacts.

on:
    workflow_dispatch:
    pull_request:
        paths:
            - tools/steam-linux/**
            - .github/workflows/steam.yml

permissions:
    contents: read

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4
            - id: version
              run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

    linux:
        needs: version
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            # Deps image plus Rust and .NET builds need the extra space
            - name: free disk space
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  df -h /

            - name: build and test steam depot
              run: bash tools/steam-linux/build-steam-linux.sh --test

            - uses: actions/upload-artifact@v4
              with:
                  name: steam-linux-x64-v${{ needs.version.outputs.version }}
                  path: dist-steam/pudu-launcher-linux-x64.tar.gz
                  if-no-files-found: error

    windows:
        needs: version
        runs-on: windows-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: ./.github/actions/tauri-build
              with:
                  build-args: --no-bundle --features no-updater --config '{"bundle":{"createUpdaterArtifacts":false}}'

            - name: collect depot
              shell: bash
              run: |
                  mkdir -p depot
                  cp src-tauri/target/release/pudu-launcher.exe depot/
                  cp src-tauri/target/release/pudu-launcher-sidecar.exe depot/

            - uses: actions/upload-artifact@v4
              with:
                  name: steam-windows-x64-v${{ needs.version.outputs.version }}
                  path: depot/
                  if-no-files-found: error

    macos:
        needs: version
        runs-on: macos-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: ./.github/actions/tauri-build
              with:
                  build-args: --bundles app --features no-updater --config '{"bundle":{"createUpdaterArtifacts":false}}'

            - name: collect depot
              run: tar -C src-tauri/target/release/bundle/macos -czf pudu-launcher-macos-arm64.tar.gz pudu-launcher.app

            - uses: actions/upload-artifact@v4
              with:
                  name: steam-macos-arm64-v${{ needs.version.outputs.version }}
                  path: pudu-launcher-macos-arm64.tar.gz
                  if-no-files-found: error
